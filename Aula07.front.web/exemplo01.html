<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de classe e id</title>

    <style>
        .caixa{
            border: 3px solid rgb(157, 6, 218);
            border-radius: 8px;
            background-color: darkcyan;
            color: rgb(43, 255, 0);
            padding? 10px;
        }

        #aviso{
            width: 200px;
            height: 100px;
        }

    </style>

</head>
<body>
    <h1>Exemplo de classe</h1>

    <p>
        Parágrafo comum da página
    </p>

    <div>Esta é uma div sem formatação.</div>

    <br>

    <div class="caixa" id="aviso">
        Esta div utiliza a classe caixa e o identificador aviso.
    </div>

    <br/>

    <span>Este é um span sem formatação</span>

    <span class="caixa">
        Este é um span utilizando a classe da caixa.
    </span>
</body>
</html>
