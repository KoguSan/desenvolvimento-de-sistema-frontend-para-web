
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horário e previsão do tempo</title>
</head>
<body>
    <h1>Horário e previsão do tempo</h1>
    
    <p>
        O programa mostrará uma saudação e uma recomendação de acordo com o clima
    </p>

    <script>
        const dataHora = new Date();
        const hora = dataHora.getHours();

        let previsaoTempo = prompt("Como está o tempo? "+
        "digite chuvoso ou ensolarado?");
    
        previsaoTempo = previsaoTempo.toLowerCase().trim();

        if (hora<12){
            alert("Bom dia! Se alimente de esperança hoje.");
            if(previsaoTempo === "ensolarado"){
                alert("Use protetor solar e carregue uma sombrinha!");
            }
            else{
                alert("O dia está chuvoso, não esqueça o guarda-chuva e tenha cuidado com pista molhada!");
            }
        }
        else if (hora<18){
            alert("Boa tarde! O sol sempre irá brilhar em um novo amanhã.");
            if(previsaoTempo === "ensolarado"){
                alert("Use protetor solar e carregue uma sombrinha!");
            }
            else{
                alert("O dia está chuvoso, não esqueça o guarda-chuva e tenha cuidado com pista molhada!");
            }
        }
        else{
            alert("Boa noite! A escuridão domina agora, mas o sol sempre ressurgirá.");
            if(previsaoTempo === "ensolarado"){
                alert("Use protetor solar e carregue uma sombrinha!");
            }
            else{
                alert("O dia está chuvoso, não esqueça o guarda-chuva e tenha cuidado com pista molhada!");
            }
        }
    </script>
</body>
</html>
