<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo de aula e css interno</title>
    <style>
        .titulo{
            color: orangered;
            text-align: center;
        }

        .caixa01{
            background-color: rgb(67, 124, 230);
            border: 2px solid darkblue;
            padding: 20px;
            margin: 20px;
        }

        .caixa02{
            background-color: rgb(230, 140, 67);
            border: 2px solid rgb(139, 0, 116);
            padding: 20px;
            margin: 20px;
        }

        .destaque01{
            color: black;
            font-weight: bold;
        }
        .destaque02{
            color: darkgreen;
            background-color: aliceblue;
            font-style: italic;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1 class="titulo">aprendendo classes em CSS</h1>
    <div class="caixa01">
        <p>
            Estou aprendendo a utilizar classes para personalizar os elementos de uma página. 
        </p>
        <br>
        <p class="destaque01">
            Este parágrafo utiliza a classe destaque01.
        </p>
        <p class="destaque02">
            Este parágrafo utiliza a classe destaque02.
        </p>
    </div>
    <div class="caixa02">
        <p>Este parágrafo não utiliza nenhuma classe.</p>
    </div>
</body>
</html>
